[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-space-community"
version = "0.1.0"
description = "SeleneQuant Community: local-first crypto quant research and paper trading platform."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
  { name = "SeleneQuant" }
]
keywords = ["crypto", "quant", "trading", "backtest", "paper-trading", "websocket", "prediction-market"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed"
]
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "websockets>=15.0",
  "python-socks[asyncio]>=2.4.0",
  "orjson>=3.10.0",
  "structlog>=24.4.0",
  "python-dotenv>=1.0.1",
  # pandas/numpy 上界（2026-10-06）：原先只写下限，CI 浮动到 pandas 3.0.6
  # / numpy 2.4.6（本地是 2.3.3 / 2.2.6）。pandas 3.0 有破坏性变更
  # （TimedeltaIndex 移除 unit 参数、datetime 解析与 merge 键 dtype 变更），
  # 导致大批"本地绿 CI 红"的假失败。钉 <3.0 让 CI 与本地同大版。
  "pandas>=2.2.0,<3.0",
  "numpy>=1.26.0,<3.0",
  "aiosqlite>=0.20.0",
  "pyjwt>=2.8.0",
  "pyyaml>=6.0",
  "keyring>=25.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
ai = [
  "tiktoken>=0.7.0",
]
alpha = [
  "torch>=2.0.0",
  "tqdm>=4.66.0",
  "scipy>=1.12.0",
  "scikit-learn>=1.3",
]
dex = [
  "solders>=0.18.0",
  "solana>=0.30.0",
  "base58>=2.1.0",
  "aiohttp>=3.9.0",
]
tg = [
  "anthropic>=0.40.0",
  "telethon>=1.37,<2.0",
  "sqlalchemy>=2.0.0",
  "openai>=1.40.0",
  "PyYAML>=6.0",
  "feedparser>=6.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pre-commit>=3.7.0",
]
# CI 测试额外依赖（2026-10-06）：这些包被测试直接 import 却从未在任何
# pyproject 声明过——本地靠全局环境掩盖，CI 干净环境下才暴露。
# 全是 PyPI 可解析的普通包（不含本地 selene-* 包），故可安全并入 CI 安装。
# 注：akshare 已在 cn extra、plotly 在 factor-research、torch 在 alpha extra。
test = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "pyarrow>=14.0",      # pandas read_feather/to_parquet 引擎（12+ 源文件使用）
  "akshare>=1.14.0",    # ashare/commodities-fx 数据抓取（CI 跑其单测需真实 import）
]
stock = [
  "selene-space-stock",
  "selene-space-pulse",
  "yfinance>=0.2.40",
]
cn = [
  "selene-space-ashare",
  "akshare>=1.14.0",
  "baostock>=0.8.9",
  "requests>=2.31.0",
]

[project.scripts]
selenespace = "selene_space_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = [
  "packages/shared-types/selene_space_types",
  "packages/core/selene_space_core",
  "packages/cli/selene_space_cli",
  "packages/strategy-engine/selene_space_strategy",
  "packages/backtest-engine/selene_space_backtest",
  "packages/market-data/selene_space_market",
  "packages/agent-runtime/selene_space_agent",
  "packages/exchange-sdk/selene_space_exchange",
  "packages/llm-adapter/selene_space_llm",
  "packages/paper-engine/selene_space_paper",
  "packages/risk-engine/selene_space_risk",
  "packages/security-gateway/selene_space_security",
  "packages/storage/selene_space_storage",
  "packages/compat-layer/selene_space_compat",
  "packages/alpha-core/selene_space_alpha",
  "packages/stock/selene_space_stock",
  "packages/ashare/selene_space_ashare",
  "packages/pulse/selene_space_pulse",
  "packages/tg-ingest/selene_space_tg_ingest",
  "packages/macrodata/selene_space_macrodata",
  "packages/decision-workflow/selene_space_decision_workflow",
  "packages/optimize/selene_space_optimize",
  "packages/agentstudio/selene_space_agentstudio",
  "packages/daily-cycle/selene_space_daily_cycle",
  "packages/renintel/selene_space_renintel",
  "packages/market-analysis/selene_space_market_analysis",
  "packages/commodities-fx/selene_space_commodities_fx",
  "packages/factor-research/selene_space_factor_research",
  "packages/grid-engine/selene_space_grid",
  "packages/news-ingest/selene_space_news_ingest",
  "packages/ashare-select/selene_space_ashare_select",
  "packages/fund-ingest/selene_space_fund_ingest",
]

[tool.pytest.ini_options]
minversion = "8.0"
# 「not perf」的理由：性能门比的是**绝对墙钟秒数**，而基线是在某台具体机器上
# 采的（.perf_baseline.json）。CI runner 与本机的 CPU/负载都不同，同代码两次
# run 会一绿一红（实测：本地连跑 5 次 3 绿 2 红；同机 15 个样本在 0.0165~
# 0.0224s 间抖动，幅度 36%）。跑在 CI 里只会制造噪音、掩盖真实回归信号。
# 这与 network 标记同构：环境敏感的东西默认不进 CI，本地 -m perf 显式跑。
addopts = "-q --tb=short -m \"not network and not perf\""
consider_namespace_packages = true
testpaths = [
  "tests",
  "packages",
  "services",
]
pythonpath = [
  ".",
  "packages/cli",
  "packages/alpha-core",
  "packages/shared-types",
  "packages/backtest-engine",
  "packages/strategy-engine",
  "packages/stock",
  "packages/ashare",
  "packages/pulse",
  "packages/core",
  "packages/agent-runtime",
  "packages/exchange-sdk",
  "packages/market-data",
  "packages/paper-engine",
  "packages/risk-engine",
  "packages/security-gateway",
  "packages/storage",
  "packages/llm-adapter",
  "packages/compat-layer",
  "packages/benchmark",
  "packages/tg-ingest",
  "packages/decision-workflow",
  "packages/macrodata",
  "packages/optimize",
  "packages/agentstudio",
  "packages/daily-cycle",
  "packages/renintel",
  "packages/market-analysis",
  "packages/commodities-fx",
  "packages/factor-research",
  "packages/grid-engine",
  "packages/news-ingest",
  "packages/ashare-select",
  "packages/fund-ingest",
  "services/local-api",
]
markers = [
  "integration: 真实 LLM 链路测试（无 SELENE_MA_TEST_API_KEY 时 skip，CI 缺 key 构建通过）",
  "network: 真实网络请求测试（默认跳过，本地用 -m network 显式运行）",
  "perf: 墙钟性能门（默认跳过，本地用 -m perf 显式运行；见下）",
]


# Ruff config lives in ruff.toml (single source of truth)
# mypy config lives in mypy.ini (single source of truth)
