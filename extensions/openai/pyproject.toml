[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "selene-space-ext-openai"
version = "0.1.0"
description = "SeleneQuant extension: OpenAI-compatible LLM provider"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selene-space-core",
    "selene-space-llm",
]

[tool.setuptools]
package-dir = {"selene_space_ext_openai" = "."}
packages = ["selene_space_ext_openai"]

[tool.setuptools.package-data]
selene_space_ext_openai = ["manifest.json"]
