[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
exclude = (?x)(^packages/.*/tests/)
plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

[mypy-tests.*]
disallow_untyped_defs = False

# TorchScript module: @torch.jit.script functions call each other and are
# typed Any by mypy, so every return from a scripted op trips no-any-return.
[mypy-selene_space_alpha.ops.ops]
warn_return_any = False
