[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-space-commodities-fx"
version = "0.1.0"
description = "Commodities (CN futures) & FX research quotes via AKShare"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
]

[project.optional-dependencies]
cn = ["akshare>=1.14.0", "requests>=2.31.0"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["selene_space_commodities_fx"]
