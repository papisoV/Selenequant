[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-space-exchange"
version = "0.1.0"
description = "Native exchange WebSocket and REST adapters"
readme = {text = "Native exchange WebSocket and REST adapters", content-type = "text/plain"}
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "selene-space-types",
    "selene-space-core",
    "websockets>=15.0",
    "python-socks[asyncio]>=2.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["selene_space_exchange"]
