# ADX Volatility Breakout Strategy
# Breakout confirmed by ADX strength.

id: template-adx-breakout
name: ADX Volatility Breakout
type: adx_breakout
description: >
  Breakout strategy with ADX confirmation.
  Enters when ADX rises above threshold with price momentum.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  adx_period: 14
  adx_threshold: 20

entry_rules:
  long:
    - indicator: adx
      params:
        period: 14
      operator: greater_than
      comparator: 18
    - indicator: ema
      params:
        period: 9
      operator: crosses_above
      comparator:
        indicator: ema
        params:
          period: 21

exit_rules:
  close_long:
    - indicator: adx
      params:
        period: 14
      operator: less_than
      comparator: 12

risk_params:
  stop_loss_pct: 0.04
  take_profit_pct: 0.08
  max_position_pct: 0.1
  max_open_positions: 1