# RSI Momentum Strategy
# Momentum-based using RSI for entry signals.

id: template-rsi-momentum
name: RSI Momentum
type: rsi_momentum
description: >
  RSI-based momentum strategy.
  Buys when RSI crosses above oversold level, sells at overbought.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70

entry_rules:
  long:
    - indicator: rsi
      params:
        period: 14
      operator: crosses_above
      comparator: 45

exit_rules:
  close_long:
    - indicator: rsi
      params:
        period: 14
      operator: crosses_above
      comparator: 65

risk_params:
  stop_loss_pct: 0.02
  take_profit_pct: 0.05
  max_position_pct: 0.1
  max_open_positions: 1