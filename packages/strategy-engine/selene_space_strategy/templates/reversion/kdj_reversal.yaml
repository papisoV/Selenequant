# KDJ Reversal Strategy
# Buy when J line crosses below 20 (oversold), sell when J line crosses above 80 (overbought)

id: template-kdj-reversal
name: KDJ Reversal
type: kdj_reversal
description: >
  Mean-reversion strategy using the KDJ stochastic oscillator.
  Goes long when the J line drops below 20 (oversold zone),
  and closes the position when J line rises above 80 (overbought zone).
symbols:
  - BTC/USDT
interval: 1h
parameters:
  kdj_period: 9
  smooth_period: 3
  oversold: 20
  overbought: 80

entry_rules:
  long:
    - indicator: kdj
      params:
        period: 9
        smooth_period: 3
      field: j
      operator: less_than
      comparator: 20.0

exit_rules:
  close_long:
    - indicator: kdj
      params:
        period: 9
        smooth_period: 3
      field: j
      operator: greater_than
      comparator: 80.0

risk_params:
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  max_position_pct: 0.1
  max_open_positions: 1
