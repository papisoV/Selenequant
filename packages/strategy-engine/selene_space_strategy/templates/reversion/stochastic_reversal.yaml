# Stochastic Reversal Strategy
# Buy when %K crosses below 20 (oversold), sell when %K crosses above 80 (overbought)

id: template-stoch-reversal
name: Stochastic Reversal
type: stochastic_reversal
description: >
  Mean-reversion strategy using Stochastic Oscillator.
  Goes long when %K drops below 20 (oversold zone),
  and closes the position when %K rises above 80 (overbought zone).
symbols:
  - BTC/USDT
interval: 1h
parameters:
  k_period: 14
  smooth_k: 3
  d_period: 3
  oversold: 20
  overbought: 80

entry_rules:
  long:
    - indicator: stoch
      params:
        period: 14
        smooth_k: 3
        d_period: 3
      field: k
      operator: less_than
      comparator: 20.0

exit_rules:
  close_long:
    - indicator: stoch
      params:
        period: 14
        smooth_k: 3
        d_period: 3
      field: k
      operator: greater_than
      comparator: 80.0

risk_params:
  stop_loss_pct: 0.02
  take_profit_pct: 0.05
  max_position_pct: 0.1
  max_open_positions: 1
