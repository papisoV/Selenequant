# ADX Range-Bound Strategy
# Trade within range when ADX indicates weak trend (< 25)

id: template-adx-range
name: ADX Range Trading
type: adx_range
description: >
  Range-bound strategy based on ADX trend strength indicator.
  Enters mean-reversion trades when ADX is below 25 (weak/no trend),
  indicating sideways market conditions suitable for range trading.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  adx_period: 14
  adx_threshold: 25
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70

entry_rules:
  long:
    - indicator: adx
      params:
        period: 14
      operator: less_than
      comparator: 25.0
    - indicator: rsi
      params:
        period: 14
      operator: less_than
      comparator: 30.0

exit_rules:
  close_long:
    - indicator: rsi
      params:
        period: 14
      operator: greater_than
      comparator: 70.0

risk_params:
  stop_loss_pct: 0.015
  take_profit_pct: 0.03
  max_position_pct: 0.1
  max_open_positions: 1
