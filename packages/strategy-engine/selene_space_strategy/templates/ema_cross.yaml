# EMA Crossover Strategy
# Buy when EMA fast crosses above EMA slow, sell on reverse.

id: template-ema-cross
name: EMA Crossover
type: ema_cross
description: >
  Exponential Moving Average crossover strategy.
  Goes long when fast EMA crosses above slow EMA, exits on reverse crossover.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  ema_fast: 12
  ema_slow: 26

entry_rules:
  long:
    - indicator: ema
      params:
        period: 9
      operator: crosses_above
      comparator:
        indicator: ema
        params:
          period: 21

exit_rules:
  close_long:
    - indicator: ema
      params:
        period: 9
      operator: crosses_below
      comparator:
        indicator: ema
        params:
          period: 21

risk_params:
  stop_loss_pct: 0.03
  take_profit_pct: 0.06
  max_position_pct: 0.1
  max_open_positions: 1