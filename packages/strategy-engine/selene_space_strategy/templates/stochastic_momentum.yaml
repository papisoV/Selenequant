# Stochastic Momentum Strategy
# Momentum-based using Stochastic oscillator.

id: template-stoch-momentum
name: Stochastic Momentum
type: stochastic_momentum
description: >
  Stochastic oscillator momentum strategy.
  Uses %K and %D crossovers for entry signals.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  stoch_k: 14
  stoch_d: 3
  stoch_smooth: 3

entry_rules:
  long:
    - indicator: stoch
      params:
        k_period: 14
        d_period: 3
        smooth: 3
      operator: less_than
      comparator: 20

exit_rules:
  close_long:
    - indicator: stoch
      params:
        k_period: 14
        d_period: 3
        smooth: 3
      operator: greater_than
      comparator: 80

risk_params:
  stop_loss_pct: 0.03
  take_profit_pct: 0.06
  max_position_pct: 0.1
  max_open_positions: 1