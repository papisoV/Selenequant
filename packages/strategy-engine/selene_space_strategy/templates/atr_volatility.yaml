# ATR Volatility Strategy
# Uses ATR to measure and trade volatility.

id: template-atr-volatility
name: ATR Volatility Strategy
type: atr_volatility
description: >
  ATR-based volatility trading strategy.
  Enters on volatility expansion, uses ATR for stop placement.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  atr_period: 14
  atr_multiplier: 2.5

entry_rules:
  long:
    - indicator: ema
      params:
        period: 9
      operator: crosses_above
      comparator:
        indicator: ema
        params:
          period: 21

exit_rules:
  close_long:
    - indicator: ema
      params:
        period: 9
      operator: crosses_below
      comparator:
        indicator: ema
        params:
          period: 21

risk_params:
  stop_loss_pct: 0.025
  take_profit_pct: 0.05
  max_position_pct: 0.1
  max_open_positions: 1