# ICT FVG Strategy
# Fair Value Gap based entry, single-condition (directional signal)

id: template-ict-fvg
name: ICT FVG Reentry
type: ict
description: >
  ICT Fair Value Gap strategy.
  Entry on a directional FVG signal (+1 bullish / -1 bearish).
  Simple version using only registered indicators.
symbols:
  - BTC/USDT
interval: 4h
parameters:
  fvg_min_gap_atr: 0.1

# No order_block confirmation here: the same candle cannot be both an FVG's
# third candle (bar i-2 and bar i non-overlapping) and the opposing candle
# before a displacement, so an AND of the two detectors is unsatisfiable.

entry_rules:
  long:
    # Bullish gap only (+1). greater_than 0 instead of exists so the short
    # leg's -1 never satisfies a long rule.
    - indicator: fvg
      params:
        period: 3
        min_gap_atr: 0.1
      operator: greater_than
      comparator: 0

  short:
    # Bearish gap only (-1).
    - indicator: fvg
      params:
        period: 3
        min_gap_atr: 0.1
      operator: less_than
      comparator: 0

exit_rules:
  close_long:
    # RSI overbought exit
    - indicator: rsi
      params:
        period: 14
      operator: greater_than
      comparator: 70

  close_short:
    # RSI oversold exit
    - indicator: rsi
      params:
        period: 14
      operator: less_than
      comparator: 30

risk_params:
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  max_position_pct: 0.1
  max_open_positions: 1

tags:
  - ict
  - fvg
  - price_action
