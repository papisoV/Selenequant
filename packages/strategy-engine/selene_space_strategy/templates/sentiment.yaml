# WARNING: This template is NOT a sentiment strategy.
# The description and sentiment_config block suggest news-based sentiment analysis,
# but the actual entry_rules/exit_rules use RSI momentum (RSI>55 entry, RSI<45 exit).
# The sentiment analyzer module was never implemented (see factory.py:1156-1157).
# Treated as: RSI momentum strategy with sentiment_config as dead config.
#
# Buy when RSI(14) > 55 (momentum breakout), close when RSI(14) < 45.

id: template-sentiment
name: Sentiment Analysis
type: sentiment
description: >
  RSI momentum strategy (misleadingly named "Sentiment Analysis").
  Entry: RSI(14) > 55. Exit: RSI(14) < 45.
  The sentiment_config block below is a placeholder and is NOT consumed by any code.
  The news-based sentiment analyzer described in older docs was never implemented.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  news_source: crypto_news  # News data source identifier
  sentiment_threshold_positive: 0.5  # Threshold for buy signal (0 to 1)
  sentiment_threshold_negative: -0.5  # Threshold for sell signal (-1 to 0)
  lookback_period: 24  # Hours to look back for sentiment aggregation
  aggregation_method: mean  # How to aggregate sentiment over lookback period

entry_rules:
  long:
    - indicator: rsi
      params:
        period: 14
      operator: greater_than
      comparator: 55

exit_rules:
  close_long:
    - indicator: rsi
      params:
        period: 14
      operator: less_than
      comparator: 45

risk_params:
  stop_loss_pct: 0.03
  take_profit_pct: 0.06
  max_position_pct: 0.1
  max_open_positions: 1

# Custom sentiment configuration
# NOTE: This entire block is a PLACEHOLDER. No code consumes it.
# The sentiment analyzer module was never implemented (factory.py:1156-1157).
# This config is kept for historical reference only.
sentiment_config:
  # Keywords for sentiment scoring
  positive_keywords:
    - bull
    - rally
    - surge
    - gain
    - profit
    - up
    - rise
    - bullish
    - positive
    - growth

  negative_keywords:
    - bear
    - crash
    - drop
    - loss
    - down
    - fall
    - bearish
    - negative
    - decline
    - dump

  # NLTK settings
  tokenizer: nltk.word_tokenize
  language: en

  # Data source settings
  news_feed_type: crypto_news  # Options: crypto_news, twitter, reddit
  update_frequency: 1h  # How often to fetch new sentiment data