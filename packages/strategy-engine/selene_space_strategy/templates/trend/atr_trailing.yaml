# ATR Trailing Stop Trend Strategy
# Follow trends using ATR-based trailing stop

id: template-atr-trailing
name: ATR Trailing Stop
type: atr_trailing
description: >
  Trend-following strategy with ATR-based trailing stop.
  Enters on momentum, exits when price reverses by ATR multiplier.
  Uses ATR to set dynamic trailing stop-loss levels.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  atr_period: 14
  atr_multiplier: 3.0
  sma_period: 50

entry_rules:
  long:
    - indicator: close
      operator: greater_than
      comparator:
        indicator: sma
        params:
          period: 50
    - indicator: rsi
      params:
        period: 14
      operator: greater_than
      comparator: 50.0

exit_rules:
  close_long:
    - indicator: close
      operator: less_than
      comparator:
        indicator: close
        operator: subtract
        value_indicator:
          indicator: atr
          params:
            period: 14
          multiplier: 3.0
        offset_bars: -10

risk_params:
  stop_loss_pct: 0.05
  take_profit_pct: 0.15
  max_position_pct: 0.1
  max_open_positions: 1
  use_atr_stops: true
  atr_sl_mult: 1.5
  atr_tp_mult: 3.0
  atr_initial_mult: 1.5
  atr_breakeven_mult: 2.0
  stop_loss_type: atr_dynamic
  position_sizing_method: kelly_half
