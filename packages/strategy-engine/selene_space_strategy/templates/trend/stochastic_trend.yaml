# Stochastic Trend Following Strategy
# Follow trend using %K and %D crossovers

id: template-stochastic-trend
name: Stochastic Trend Following
type: stochastic_trend
description: >
  Trend-following strategy using Stochastic oscillator.
  Goes long when %K crosses above %D with bullish momentum,
  and closes when %K crosses below %D.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  k_period: 14
  smooth_k: 3
  d_period: 3

entry_rules:
  long:
    - indicator: stoch
      params:
        period: 14
        smooth_k: 3
        d_period: 3
      field: k
      operator: crosses_above
      comparator:
        indicator: stoch
        params:
          period: 14
          smooth_k: 3
          d_period: 3
        field: d

exit_rules:
  close_long:
    - indicator: stoch
      params:
        period: 14
        smooth_k: 3
        d_period: 3
      field: k
      operator: crosses_below
      comparator:
        indicator: stoch
        params:
          period: 14
          smooth_k: 3
          d_period: 3
        field: d

risk_params:
  stop_loss_pct: 0.03
  take_profit_pct: 0.07
  max_position_pct: 0.1
  max_open_positions: 1
