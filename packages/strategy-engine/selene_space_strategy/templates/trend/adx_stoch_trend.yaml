# Combined ADX + Stochastic Trend Strategy
# Trend-following with ADX filter and Stochastic entry timing

id: template-adx-stoch-trend
name: ADX Stochastic Trend
type: adx_stoch_trend
description: >
  Trend-following strategy combining ADX trend filter with Stochastic entry timing.
  Enters long when ADX > 25 (strong trend) and Stochastic %K crosses above %D.
  Exits when ADX weakens or Stochastic generates bearish signal.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  adx_period: 14
  stoch_k_period: 14
  stoch_smooth_k: 3
  stoch_d_period: 3
  adx_threshold: 25

entry_rules:
  long:
    - indicator: adx
      params:
        period: 14
      field: adx
      operator: greater_than
      comparator: 25.0
    - indicator: adx
      params:
        period: 14
      field: plus_di
      operator: greater_than
      comparator:
        indicator: adx
        params:
          period: 14
        field: minus_di
    - indicator: stoch
      params:
        period: 14
        smooth_k: 3
        d_period: 3
      field: k
      operator: crosses_above
      comparator:
        indicator: stoch
        params:
          period: 14
          smooth_k: 3
          d_period: 3
        field: d

exit_rules:
  close_long:
    - indicator: adx
      params:
        period: 14
      field: adx
      operator: less_than
      comparator: 20.0
    - indicator: stoch
      params:
        period: 14
        smooth_k: 3
        d_period: 3
      field: k
      operator: crosses_below
      comparator:
        indicator: stoch
        params:
          period: 14
          smooth_k: 3
          d_period: 3
        field: d

risk_params:
  stop_loss_pct: 0.03
  take_profit_pct: 0.12
  max_position_pct: 0.1
  max_open_positions: 1
