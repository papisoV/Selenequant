# KDJ Trend Following Strategy
# Follow trend when K and D lines cross with momentum

id: template-kdj-trend
name: KDJ Trend Following
type: kdj_trend
description: >
  Trend-following strategy using KDJ oscillator crossovers.
  Goes long when K line crosses above D line in oversold zone (<50),
  and closes when K crosses below D line in overbought zone (>50).
symbols:
  - BTC/USDT
interval: 1h
parameters:
  kdj_period: 9
  smooth_period: 3
  entry_zone: 50
  exit_zone: 50

entry_rules:
  long:
    - indicator: kdj
      params:
        period: 9
        smooth_period: 3
      field: k
      operator: crosses_above
      comparator:
        indicator: kdj
        params:
          period: 9
          smooth_period: 3
        field: d
    - indicator: kdj
      params:
        period: 9
        smooth_period: 3
      field: k
      operator: less_than
      comparator: 50.0

exit_rules:
  close_long:
    - indicator: kdj
      params:
        period: 9
        smooth_period: 3
      field: k
      operator: crosses_below
      comparator:
        indicator: kdj
        params:
          period: 9
          smooth_period: 3
        field: d
    - indicator: kdj
      params:
        period: 9
        smooth_period: 3
      field: k
      operator: greater_than
      comparator: 50.0

risk_params:
  stop_loss_pct: 0.03
  take_profit_pct: 0.08
  max_position_pct: 0.1
  max_open_positions: 1
