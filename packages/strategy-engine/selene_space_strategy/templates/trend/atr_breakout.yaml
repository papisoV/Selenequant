# ATR Breakout Trend Strategy
# Follow trends using ATR-based breakout levels

id: template-atr-breakout
name: ATR Breakout Trend
type: atr_breakout
description: >
  Trend-following strategy using ATR for volatility-based breakouts.
  Goes long when price breaks above SMA + ATR multiplier,
  indicating strong upward momentum.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  atr_period: 14
  sma_period: 20
  atr_multiplier: 2.0

entry_rules:
  long:
    - indicator: close
      operator: crosses_above
      comparator:
        indicator: sma
        params:
          period: 20
        operator: add
        value_indicator:
          indicator: atr
          params:
            period: 14
          multiplier: 2.0

exit_rules:
  close_long:
    - indicator: close
      operator: crosses_below
      comparator:
        indicator: sma
        params:
          period: 20

risk_params:
  stop_loss_pct: 0.03
  take_profit_pct: 0.09
  max_position_pct: 0.1
  max_open_positions: 1
