# ICT Order Block Strategy
# Entry on Order Block retest after displacement

id: template-ict-ob
name: ICT Order Block
type: ict
description: >
  ICT Order Block strategy.
  Entry when price returns to an Order Block zone.
  Simple version using only registered indicators.
symbols:
  - BTC/USDT
interval: 4h
parameters:
  ob_move_threshold: 2.0
  ob_max_age: 30

entry_rules:
  long:
    # Bullish Order Block exists
    - indicator: order_block
      params:
        period: 20
        move_threshold: 2.0
      operator: exists
      comparator: 0

    # FVG present (displacement confirmation)
    - indicator: fvg
      params:
        period: 3
        min_gap_atr: 0.1
      operator: exists
      comparator: 0

    # Market structure bullish or ranging
    - indicator: market_structure
      params:
        period: 10
      operator: greater_than
      comparator: 0

  short:
    # Bearish Order Block exists
    - indicator: order_block
      params:
        period: 20
        move_threshold: 2.0
      operator: exists
      comparator: 0

    # FVG present
    - indicator: fvg
      params:
        period: 3
        min_gap_atr: 0.1
      operator: exists
      comparator: 0

    # Market structure bearish
    - indicator: market_structure
      params:
        period: 10
      operator: less_than
      comparator: 0

exit_rules:
  close_long:
    # RSI overbought exit
    - indicator: rsi
      params:
        period: 14
      operator: greater_than
      comparator: 70

  close_short:
    # RSI oversold exit
    - indicator: rsi
      params:
        period: 14
      operator: less_than
      comparator: 30

risk_params:
  stop_loss_pct: 0.025
  take_profit_pct: 0.05
  max_position_pct: 0.1
  max_open_positions: 1

tags:
  - ict
  - order_block
  - displacement
