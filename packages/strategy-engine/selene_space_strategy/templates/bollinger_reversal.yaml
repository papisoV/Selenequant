# Bollinger Band Reversal Strategy
# Mean reversion at Bollinger Band extremes.

id: template-bollinger-reversal
name: Bollinger Band Reversal
type: bollinger_reversal
description: >
  Bollinger Band mean reversion strategy.
  Buys when price touches lower band, sells at middle/upper band.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  bb_period: 20
  bb_std: 2

entry_rules:
  long:
    - indicator: bbands
      params:
        period: 20
        std: 2
      operator: less_than
      comparator:
        indicator: bbands
        params:
          band: lower

exit_rules:
  close_long:
    - indicator: bbands
      params:
        period: 20
        std: 2
      operator: greater_than
      comparator:
        indicator: bbands
        params:
          band: upper

risk_params:
  stop_loss_pct: 0.025
  take_profit_pct: 0.05
  max_position_pct: 0.1
  max_open_positions: 1