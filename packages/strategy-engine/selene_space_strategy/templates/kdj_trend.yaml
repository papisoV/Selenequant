# KDJ Trend Following Strategy
# KDJ-based trend following with dynamic parameters.

id: template-kdj-trend
name: KDJ Trend Following
type: kdj_trend
description: >
  KDJ-based trend following strategy.
  Uses KDJ golden cross for trend direction.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  kdj_n: 9
  kdj_m1: 3
  kdj_m2: 3

entry_rules:
  long:
    - indicator: kdj
      params:
        n: 9
        m1: 3
        m2: 3
      operator: less_than
      comparator: 20

exit_rules:
  close_long:
    - indicator: kdj
      params:
        n: 9
        m1: 3
        m2: 3
      operator: greater_than
      comparator: 80

risk_params:
  stop_loss_pct: 0.03
  take_profit_pct: 0.06
  max_position_pct: 0.1
  max_open_positions: 1