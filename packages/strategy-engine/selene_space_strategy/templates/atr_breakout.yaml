# ATR Breakout Strategy
# Volatility breakout when price moves beyond ATR range.

id: template-atr-breakout
name: ATR Breakout
type: atr_breakout
description: >
  ATR volatility breakout strategy.
  Enters on significant price movement beyond ATR range.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  atr_period: 14
  atr_multiplier: 2.0

entry_rules:
  long:
    - indicator: ema
      params:
        period: 9
      operator: crosses_above
      comparator:
        indicator: ema
        params:
          period: 21

exit_rules:
  close_long:
    - indicator: ema
      params:
        period: 9
      operator: crosses_below
      comparator:
        indicator: ema
        params:
          period: 21

risk_params:
  stop_loss_pct: 0.035
  take_profit_pct: 0.07
  max_position_pct: 0.1
  max_open_positions: 1