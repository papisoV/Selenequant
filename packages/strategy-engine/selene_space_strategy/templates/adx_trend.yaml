# ADX Trend Follower Strategy
# Buy when ADX > threshold indicating strong trend, sell when trend weakens.

id: template-adx-trend
name: ADX Trend Follower
type: adx_trend
description: >
  ADX-based trend following strategy.
  Enters when ADX > threshold indicates strong trend.
  Uses SMA cross for entry signals.
symbols:
  - BTC/USDT
interval: 1h
parameters:
  adx_period: 14
  adx_threshold: 25

entry_rules:
  long:
    - indicator: adx
      params:
        period: 14
      operator: greater_than
      comparator: 18
    - indicator: ema
      params:
        period: 9
      operator: crosses_above
      comparator:
        indicator: ema
        params:
          period: 21

exit_rules:
  close_long:
    - indicator: adx
      params:
        period: 14
      operator: less_than
      comparator: 15

risk_params:
  stop_loss_pct: 0.04
  take_profit_pct: 0.08
  max_position_pct: 0.1
  max_open_positions: 1