[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-space-cli"
version = "0.1.0"
description = "SeleneQuant command-line interface"
readme = { text = "CLI for SeleneQuant Community", content-type = "text/plain" }
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "selene-space-types",
  "selene-space-core",
  "selene-space-strategy",
  "selene-space-backtest",
  "selene-space-paper",
  "selene-space-risk",
  "selene-space-storage",
  "selene-space-security",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
selenespace = "selene_space_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["selene_space_cli"]
