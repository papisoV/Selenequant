[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-space-storage"
version = "0.1.0"
description = "Local persistence (SQLite + Parquet)"
readme = {text = "Local persistence (SQLite + Parquet)", content-type = "text/plain"}
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "selene-space-types",
    "selene-space-core",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["selene_space_storage"]
