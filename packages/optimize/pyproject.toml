[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-space-optimize"
version = "0.1.0"
description = "RL trading agents (SB3) + portfolio optimization (scipy) for SeleneQuant"
readme = {text = "RL + portfolio optimization for SeleneQuant", content-type = "text/plain"}
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "selene-space-types",
    "selene-space-core",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.2",
    "gymnasium>=0.29",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "stable-baselines3>=2.2",
    "gymnasium>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["selene_space_optimize"]
