[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-space-macrodata"
version = "0.1.0"
description = "Macro economic data sources (FRED, BIS, BLS, IMF, DBnomics) for crypto quant platform"
readme = {text = "Macro economic data sources for crypto quant platform", content-type = "text/plain"}
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "selene-space-types",
    "selene-space-core",
    "pandas>=2.0",
    "numpy>=1.24",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["selene_space_macrodata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
