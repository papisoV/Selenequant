[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-space-grid"
version = "0.1.0"
description = "Neutral two-leg grid engine (intra-bar cell-touch fills) for SeleneQuant research pipeline"
readme = {text = "Neutral two-leg grid engine ported from the user's grid_sim experiment.", content-type = "text/plain"}
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "selene-space-types",
    "selene-space-backtest",
    "selene-space-strategy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["selene_space_grid"]
