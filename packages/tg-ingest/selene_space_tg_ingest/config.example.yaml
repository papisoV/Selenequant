crawl:
  interval_minutes: 30
  limit: 100
  max_delay: 3
  min_delay: 1
  mode: incremental
groups:
- id: 0
  name: '[示例群组]'
  username: example_channel
  auto_catchup: false
  auto_poll: false
  poll_interval_seconds: 15
proxy:
  enabled: false
  host: 127.0.0.1
  port: 7890
  protocol: socks5
storage:
  db_path: ./data/tgwatcher.db
timezone:
  utc_offset_hours: 8
telegram:
  api_hash: YOUR_API_HASH_HERE
  api_id: YOUR_API_ID_HERE
  phone: '+1234567890'
  session_dir: ./sessions
signal:
  enabled: false
  llm:
    provider: deepseek
    # Multi-provider fallback (new): secondary providers carry full credentials
    # here. The primary provider (provider:) uses the flat base_url/api_key/model
    # fields below. fallback_order tries providers in order on transient errors
    # (rate limit / 5xx / truncation) and skips any whose SDK is not installed.
    providers:
      anthropic:
        api_key: ''
        base_url: https://api.anthropic.com
        model: claude-sonnet-5
        max_tokens: 512
    fallback_order:
    - deepseek
    - anthropic
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    api_key: ''
    temperature: 0
    max_tokens: 512
    timeout_connect: 30
    timeout_read: 60
  filter:
    min_text_length: 10
    pass_if_any_match: true
  batch_size: 50
  llm_batch_size: 15
  llm_delay: 1.0
  factor_version: 2
  keywords:
    bullish:
    - "利好"
    - "上涨"
    - "突破"
    - "新高"
    - "反弹"
    - "买入"
    - "减半"
    - "批准"
    - "ETF通过"
    - "通过ETF"
    - "利好消息"
    bearish:
    - "利空"
    - "下跌"
    - "暴跌"
    - "崩盘"
    - "黑客"
    - "被盗"
    - "跑路"
    - "禁令"
    - "监管"
    - "罚款"
    - "起诉"
    - "利空消息"
    event_regulatory:
    - SEC
    - "监管"
    - "合规"
    - "禁令"
    - "罚款"
    - "牌照"
    - "起诉"
    - "审查"
    event_macro:
    - "美联储"
    - "加息"
    - "降息"
    - CPI
    - GDP
    - "战争"
    - "制裁"
    - "通胀"
    - "利率"
    event_exploit:
    - "黑客"
    - "被盗"
    - "漏洞"
    - "攻击"
    - "跑路"
    - Rug
    - "闪电贷"
    event_listing:
    - "上线"
    - "挂牌"
    - Binance
    - Coinbase
    - "上架"
    - Launchpool
    event_partnership:
    - "合作"
    - "集成"
    - "战略"
    - "投资"
    - "收购"
    - "生态"
    event_whale:
    - "鲸鱼"
    - "巨鲸"
    - "大额转账"
    - "大额转移"
    - "政府抛售"
    - "国家抛售"
    - "机构买入"
    - "机构卖出"
    - MicroStrategy
    - "持仓"
    - "增持"
    - "冷钱包"
    - "热钱包"
    - "钱包异动"
    urgency_high:
    - "紧急"
    - "暴跌"
    - "崩盘"
    - "黑客"
    - "被盗"
    - "SEC起诉"
    - "被黑"
catchup:
  enabled: true
  limit: 1000
