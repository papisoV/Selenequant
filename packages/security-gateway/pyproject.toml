[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selene-space-security"
version = "0.1.0"
description = "Policy, tool gating, redaction, approvals"
readme = {text = "Policy, tool gating, redaction, approvals", content-type = "text/plain"}
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "selene-space-types",
    "selene-space-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
keyring = [
    "keyring>=24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["selene_space_security"]
