[project]
name = "tgwatcher"
version = "1.0.0"
description = "Telegram group message crawler with web management panel"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
authors = [{name = "papisoV"}]
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.37,<2.0",
    "pysocks>=1.7.1",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "flask>=3.0.0",
    "openai>=1.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
tgwatcher = "main:main"
tgwatcher-web = "tgwatcher.web.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["tgwatcher*"]

[tool.setuptools.package-data]
tgwatcher = ["web/static/*"]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (fast, isolated)",
    "integration: integration tests (DB, network)",
    "e2e: end-to-end tests",
]
